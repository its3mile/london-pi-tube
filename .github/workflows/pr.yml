name: Pull Request

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host-side unit tests for application (TfL parsing, time, schedule).
      # Needs no Pico SDK, picotool, or firmware/src/config.rs.
      - name: Test
        run: cargo test-host

  pull_request:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment

      - name: Set Config
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          TFL_API_KEY: ${{ secrets.TFL_API_KEY }}
        run: |
          # Fail the build rather than ship firmware that can never connect to
          # Wi-Fi or fetch data (TfL rejects an empty key). Secrets are also
          # unavailable to pull requests from forks.
          missing=0
          for name in WIFI_SSID WIFI_PASSWORD TFL_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          sed 's/"your-ssid"/"'"$WIFI_SSID"'"/g; s/r"your-wifi-password"/r"'"$WIFI_PASSWORD"'"/g; s/"your-tfl-api-key"/"'"$TFL_API_KEY"'"/g' firmware/config.template.rs > firmware/src/config.rs

      - name: Build (release)
        run: |
          cargo build --release

      - name: Create UF2 from ELF
        run: |
          sudo picotool uf2 convert \
            target/thumbv8m.main-none-eabihf/release/london-pi-tube -t elf \
            target/thumbv8m.main-none-eabihf/release/london-pi-tube.uf2 -t uf2

      - uses: actions/upload-artifact@v7
        name: Update Artefact
        with:
          name: london-pi-tube.uf2
          path: target/thumbv8m.main-none-eabihf/release/london-pi-tube.uf2

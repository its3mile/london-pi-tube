name: Release

on:
  push:
    branches: ["main", "fix-release-tag-name"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG_NAME: ""

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment

      - name: Set Config
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          sed 's/"your-ssid"/"'"$WIFI_SSID"'"/g; s/r"your-wifi-password"/r"'"$WIFI_PASSWORD"'"/g' config.template.rs > src/config.rs

      - name: Build (release)
        run: |
          cargo build --release

      - name: Create UF2 from ELF
        run: |
          sudo picotool uf2 convert \
            target/thumbv8m.main-none-eabihf/release/london-pi-tube -t elf \
            target/thumbv8m.main-none-eabihf/release/london-pi-tube.uf2 -t uf2

      - name: Derive Short SHA and Create Tag
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="release-${SHORT_SHA}"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: |
            target/thumbv8m.main-none-eabihf/release/london-pi-tube
            target/thumbv8m.main-none-eabihf/release/london-pi-tube.uf2

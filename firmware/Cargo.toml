[package]
name = "firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

# The output binary is named after the project rather than the package, e.g.
# target/thumbv8m.main-none-eabihf/release/london-pi-tube
[[bin]]
name = "london-pi-tube"
path = "src/main.rs"
# The firmware only runs on the RP2350, so there is no test harness for it.
test = false
bench = false

# `cargo test` from the workspace root builds this target, which fails with a
# message pointing at the real tests. See tests/run_tests_on_host.rs.
[[test]]
name = "run_tests_on_host"
harness = false

[features]
# Test builds only: panic deliberately a few seconds after boot, to exercise
# the panic handler's display-then-restart path (see src/panic.rs).
#   cargo run --release --features panic-restart-test
panic-restart-test = []
# Test builds only: overflow the stack a few seconds after boot, to exercise
# flip-link and the HardFault handler (see src/fault.rs).
#   cargo run --release --features stack-overflow-test
stack-overflow-test = []
# Test builds only: block the executor a few seconds after boot, to exercise
# the hardware watchdog (see src/tasks/watchdog.rs).
#   cargo run --release --features watchdog-hang-test
watchdog-hang-test = []

[build-dependencies]
regex = "1.12.2"

[dependencies]
application = { workspace = true, features = ["defmt"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xb",
    "binary-info",
] }
rp-pac = { version = "7.0.0", features = ["rp235x"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "icmp",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-usb-logger = "0.6.0"
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = { workspace = true }
defmt-rtt = "1.0.0"
fixed = "1.29.0"
fixed-macro = "1.2"
reqwless = { version = "0.14.0", default-features = false, features = [
    "defmt",
    "embedded-tls",
] }
serde = { workspace = true }
serde-json-core = { workspace = true, features = ["defmt"] }
assign-resources = "0.5.0"
#cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor"] }
critical-section = "1.2"
panic-probe = { version = "1.0.0", default-features = false, features = [
    "rtt-target",
] }
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.1"
mipidsi = "0.10.0"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.3", default-features = false }
smart-leds = "0.4.0"
heapless = { workspace = true, features = ["defmt"] }
usbd-hid = "0.10.0"

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async", "defmt-03"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-storage = { version = "0.3" }
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }
log = "0.4"
rand = { version = "0.10.1", default-features = false }

bt-hci = { version = "0.8.1", default-features = false, features = ["defmt"] }
# Fork of the official rust-embedded-community/epd-waveshare main, with two
# fixes for the 3.7in panel (issue #19):
# - deep-sleep command per the SSD1677 datasheet (upstream PR #234, unmerged)
# - 3 ms reset pulse, so the panel reliably wakes from deep sleep
epd-waveshare = { git = "https://github.com/its3mile/epd-waveshare", rev = "821c4befae46f077aa9be92f8685965a3def55d5" }
fugit = "0.4.0"
const_format = "0.2.34"
profont = "0.7.0"
u8g2-fonts = "0.7.2"
function_name = "0.3.0"
embedded-tls = { version = "0.18.0", default-features = false, features = [
    "rustpki", # Required to parse and cross-check the server's certificate handshake
] }
der = { version = "0.8.0", default-features = false, features = [
    "derive",
    "oid",
    "time",
    "heapless",
] }
embedded-iconoir = { version = "0.2.3", features = ["18px", "48px"] }
sntpc-net-embassy = "0.11.0"
sntpc = "0.11.0"
sntpc-time-embassy = "0.6.0"

[target.'cfg( target_arch = "arm" )'.dependencies]
panic-probe = { version = "1", features = ["print-defmt"] }

[target.'cfg( target_arch = "riscv32" )'.dependencies]
panic-halt = { version = "1.0.0" }

[target.riscv32imac-unknown-none-elf.dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }

[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }
